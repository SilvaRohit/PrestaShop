apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: maildev

  template:
    metadata:
      labels:
        app: maildev

    spec:
      containers:
        - name: maildev
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: smtp
              containerPort: 1025

            - name: web
              containerPort: 1080

---
apiVersion: v1
kind: Service
metadata:
  name: maildev
spec:
  type: ClusterIP

  selector:
    app: maildev

  ports:
    - name: smtp
      port: {{ .Values.service.smtpPort }}
      targetPort: smtp

    - name: web
      port: {{ .Values.service.webPort }}
      targetPort: web